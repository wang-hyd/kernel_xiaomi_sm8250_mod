name: Build LineageOS 22 Kernel for Xiaomi 10 (umi)

on:
  workflow_dispatch:
  push:
    paths:
      - 'umi_defconfig'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev python3 zip unzip device-tree-compiler

      - name: Clone LineageOS 22 SM8250 Kernel Source
        run: |
          rm -rf kernel
          git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git kernel || \
          git clone --depth=1 -b lineage-22.1 https://github.com/LineageOS/android_kernel_xiaomi_sm8250.git kernel

      - name: Download AOSP Clang Toolchain
        run: |
          mkdir -p clang
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          rm -f clang.tar.gz

      - name: Configure Kernel with Custom umi_defconfig
        run: |
          mkdir -p kernel/out
          cp umi_defconfig kernel/out/.config
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build Image and DTB
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 Image dtb

      - name: Package Artifacts
        run: |
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image dist/
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cat {} + > dist/dtb

      - name: Upload Compiled Kernel & DTB
        uses: actions/upload-artifact@v4
        with:
          name: umi-lineage22-kernel
          path: dist/
